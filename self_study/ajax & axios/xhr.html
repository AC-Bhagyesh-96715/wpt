<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="books.js"></script>
</head>
<body>
    
      <button onclick="getData()">click</button>
    <input type="number" id="input">
    <table class="table">
            <thead>
                <tr>
                    <th>#id</th>
                    <th>title</th>
                    <th>author</th>
                </tr>
            </thead>
            <tbody id="tbody">
            </tbody>
        </table>

    <script>
function getData(){
  const input = document.getElementById('input').value
  const tbody = document.getElementById('tbody')

  const xhr = new XMLHttpRequest()

  xhr.open("GET", "books.js")  // file from server

  xhr.onload = function(){
    if(xhr.status == 200){

      const data = JSON.parse(xhr.responseText)

      let found = false
      tbody.innerHTML = ""

      for(let e of data){
        if(e.id == Number(input)){
          found = true

          const row = `<tr>
            <td>${e.id}</td>
            <td>${e.title}</td>
            <td>${e.author}</td>
          </tr>`
          tbody.innerHTML += row
        }
      }

      if(!found){
        alert("No such ID found")
      }

    } else {
      console.log("Error loading data")
    }
  }

  xhr.send()
}
</script>
</body>
</html>
